apiVersion: v1
kind: Service
metadata:
  name: micro-services-service
spec:
  type: ClusterIP
  selector:
    app: micro-services
  ports:
    - name: auth
      port: 5002
      targetPort: 5002

      
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway-service
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: 4000
      nodePort: 30001
    - name: registration
      port: 5001
      targetPort: 5001

